[package]
name = "aelux-launcher-app"
version = "0.1.0-beta.1"
description = "Aelux Launcher - Minecraft Java Edition Launcher"
authors = ["Aelux Team"]
edition = "2021"

[lib]
name = "aelux_launcher_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
# 原生文件对话框（rfd 直调，见 dialog.rs；绕开 tauri-plugin-dialog 的事件循环投递管线）
# gtk3：Linux 后端（同步 FileDialog API 需要；Tauri CI 已装 GTK 依赖）
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6", "gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

# ---- 自动更新（壳层自研换身式更新，不依赖内核） ----
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# 类型化 IPC：每个 #[tauri::command] 自动生成 TS 绑定，DTO 变更前端 fail-build
# （rc 三件套精确锁版：tauri-specta rc.26 ↔ specta rc.26 ↔ specta-typescript 0.0.13）
tauri-specta = { version = "=2.0.0-rc.26", features = ["javascript", "typescript"] }
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"

# ---- 内核接入的三条链路（见 README「内核接入」） ----
# dev-path    ：本地源码联调，path 依赖 aelux-core，IDE 跳转/断点可用
aelux-core = { path = "../../Aelux-Core", optional = true }
# release-ffi ：发布打包，加载 cdylib（build.rs 负责就位库文件，运行完全离线）
libloading = { version = "0.8", optional = true }

[features]
# 本地开发：默认走源码联调（真实内核，无假数据）
default = ["dev-path"]
# 本地开发：cargo tauri dev（源码联调）
dev-path = ["dep:aelux-core"]
# 发布打包：cargo tauri build --features release-ffi
release-ffi = ["dep:libloading"]
# 发布包 + DevTools（可调试的便捷包）：
# cargo tauri build --features release-ffi,debug-tools --no-bundle
debug-tools = ["tauri/devtools"]

[profile.release]
lto = true
codegen-units = 1
strip = true

# 对话框工作线程的 STA 套间预热（仅 Windows，版本与 rfd/tauri 传递依赖一致）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com"] }
