name: CI · 检查（不发布产物）

# 公开壳层仓库的持续集成：
#   1. 前端类型检查 + 构建
#   2. Rust 编译（dev-path，默认特性，需要真实内核源码）
#   3. bindings.ts 漂移检查（Linux 上跑导出测试，diff 非空即失败）
#
# 内核依赖说明：aelux-core 是 optional path 依赖，但 Cargo resolve 阶段要求路径存在，
# 且 src-tauri 的默认特性 dev-path 会直接编译内核源码——空 stub 无法通过编译。
# 因此这里必须拉到真实内核（CORE_ACCESS_TOKEN + CORE_REPO）；取不到时直接报错退出，
# 不再退化成 stub（否则只会产生一串误导性的「aelux_core 里找不到模块」错误）。
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web

  rust:
    name: Rust 编译检查（Windows / Linux，不产出安装包）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 拉取私有内核源码：dev-path 默认特性必须编译真实内核，stub 无法通过。
      # 注意 secret 名：仓库中实际存在的是历史拼写 CORE_ACCESS_TOKE（少一个 N），
      # 这里同时兼容正确拼写 CORE_ACCESS_TOKEN，任一存在即可。
      - name: Checkout aelux-core
        id: core
        shell: bash
        env:
          CORE_TOKEN: ${{ secrets.CORE_ACCESS_TOKEN || secrets.CORE_ACCESS_TOKE }}
          CORE_REPO: ${{ secrets.CORE_REPO }}
        run: |
          CORE_DIR="$(pwd)/../Aelux-Core"
          if [ -z "$CORE_TOKEN" ] || [ -z "$CORE_REPO" ]; then
            echo "::error::缺少 CORE_ACCESS_TOKEN（或 CORE_ACCESS_TOKE）/ CORE_REPO secrets，无法获取私有内核源码"
            exit 1
          fi
          if ! git clone --depth 1 "https://x-access-token:${CORE_TOKEN}@github.com/${CORE_REPO}.git" "$CORE_DIR"; then
            echo "::error::拉取私有内核失败：请确认 CORE_ACCESS_TOKEN 有效、CORE_REPO 形如 owner/repo"
            exit 1
          fi

      - name: Install Linux deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check (dev-path)
        working-directory: src-tauri
        run: cargo check --all-targets

      # bindings.ts 必须与 Rust 命令签名同步：重新导出后 git diff 非空即失败
      - name: Bindings drift check
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo test export_bindings
          git diff --exit-code -- ../src/lib/bindings.ts || (
            echo "::error::bindings.ts 与 Rust 命令签名不同步 —— 请运行 cargo tauri dev（debug 启动会重新导出）后提交"
            exit 1
          )
