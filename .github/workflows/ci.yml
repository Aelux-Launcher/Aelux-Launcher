name: CI

# 公开壳层仓库的持续集成：
#   1. 前端类型检查 + 构建
#   2. Rust 编译（mock 默认链路，无需内核二进制）
#   3. bindings.ts 漂移检查（Linux 上跑导出测试，diff 非空即失败）
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check (mock 链路)
        working-directory: src-tauri
        run: cargo check --all-targets

      # bindings.ts 必须与 Rust 命令签名同步：重新导出后 git diff 非空即失败
      - name: Bindings drift check
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo test export_bindings
          git diff --exit-code -- ../src/lib/bindings.ts || (
            echo "::error::bindings.ts 与 Rust 命令签名不同步 —— 请运行 cargo tauri dev（debug 启动会重新导出）后提交"
            exit 1
          )
