name: Release

# 打 tag（v*）触发：拉取私有内核 cdylib → 打包安装包 → 便携 ZIP → 公开 Release。
# 内核二进制来源：CORE_MANIFEST_URL（secrets，指向 R2 桶或私有 core 仓库的 manifest.json）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      CORE_MANIFEST_URL: ${{ secrets.CORE_MANIFEST_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Fetch core cdylib
        run: node scripts/fetch-core.mjs

      - name: Build (release-ffi)
        run: npm run build:release

      - name: Package portable ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "portable/Aelux-Launcher"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "src-tauri/target/release/aelux-launcher-app.exe" $stage
          Copy-Item "src-tauri/lib/windows-x64/aelux_core.dll" $stage
          Compress-Archive -Path "portable/Aelux-Launcher" -DestinationPath "Aelux-Launcher-portable-windows-x64.zip" -Force

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.app" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} release-assets/ \; || true
          ls release-assets

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            Aelux-Launcher-portable-windows-x64.zip
