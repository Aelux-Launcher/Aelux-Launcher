name: 发布 Windows 便携包

# 发布 Windows 便携包（免安装，解压即用）。
#
# 渠道（channel）：
#   beta   → tag 必须含 beta（如 v0.2.0-beta.1），产物 Aelux-Launcher-v0.2.0-beta.1.zip
#   stable → tag 不含 beta（如 v0.2.0），产物 Aelux-Launcher-v0.2.0.zip
# tag 触发的发布按 tag 名判断渠道；workflow_dispatch 按所选渠道自动规范化版本号
# （beta 渠道输入 0.1.0 → v0.1.0-beta.1；stable 渠道输入 0.1.0-beta.1 → v0.1.0）。
#
# 发布版本号：tag 与 src-tauri/Cargo.toml、package.json、src-tauri/tauri.conf.json
# 三处版本要一致；tag 推送不一致会直接报错，workflow_dispatch 则自动对齐三处版本。
# 只出 Artifacts 测试包不必发 Release；要触发客户端自动更新，发布版本必须高于客户端当前版本。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.1.0；工作流会按渠道自动补 -beta.1 或去掉 beta 后缀）"
        required: false
        default: "0.1.0-beta.1"
      channel:
        description: "发布渠道"
        type: choice
        options: ["beta", "stable"]
        default: "beta"

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest
    env:
      CORE_MANIFEST_URL: ${{ secrets.CORE_MANIFEST_URL }}
      # 私有内核 Release 资产下载鉴权：未单独配置时复用 CORE_ACCESS_TOKEN
      CORE_DOWNLOAD_TOKEN: ${{ secrets.CORE_DOWNLOAD_TOKEN || secrets.CORE_ACCESS_TOKEN }}
      # 注入更新默认仓库（build.rs → AELUX_UPDATE_REPO，客户端 GitHub 更新源）
      GITHUB_REPO: ${{ github.repository }}
      MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
      MIRROR_REPO: ${{ vars.MIRROR_REPO }}
    steps:
      - uses: actions/checkout@v4

      # tag / 渠道 / 清单渠道 / 包名只有这一处定义，后续步骤全部引用输出，
      # 避免各步骤各算一套导致命名与清单渠道不一致。
      - name: 解析发布版本与渠道
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            channel="$INPUT_CHANNEL"
            # 镜像仓库 / 客户端都按 tag 是否含 beta 识别渠道，渠道与版本号必须自洽；
            # dispatch 表单不能随渠道联动，这里统一规范化（输入框保留 beta 版本也不会发错渠道）：
            #   beta   缺 beta 后缀 → 自动补 -beta.1
            #   stable 带 beta 等预发布后缀 → 自动去掉（0.1.0-beta.2 → 0.1.0）
            if [ "$channel" = "beta" ]; then
              if [[ "${version,,}" != *beta* ]]; then
                version="${version}-beta.1"
              fi
            else
              base="${version%%-*}"
              if [ "$base" != "$version" ]; then
                echo "[meta] 正式版渠道：${version} 去掉预发布后缀 → ${base}"
                version="$base"
              fi
            fi
          else
            version="${REF_NAME#v}"
            if [[ "${REF_NAME,,}" == *beta* ]]; then channel="beta"; else channel="stable"; fi
          fi
          if [ "$channel" = "beta" ]; then
            manifest_channel="dev"
          else
            manifest_channel="release"
          fi
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "manifest_channel=${manifest_channel}" >> "$GITHUB_OUTPUT"
          # tag 已含版本与渠道（beta 带 -beta.N，stable 不带），文件名不再重复追加后缀
          echo "zip=Aelux-Launcher-${tag}.zip" >> "$GITHUB_OUTPUT"
          echo "[meta] tag=${tag} channel=${channel} manifest=${manifest_channel}"

      # aelux-core 是 optional path 依赖，Cargo resolve 要求路径存在；
      # release-ffi 只消费 cdylib 二进制（fetch-core 下载），不需要内核源码。
      - name: Stub aelux-core (resolve only)
        shell: bash
        run: |
          CORE_DIR="$(pwd)/../Aelux-Core"
          mkdir -p "$CORE_DIR/src"
          printf '[package]\nname = "aelux-core"\nversion = "0.0.0"\nedition = "2021"\n' > "$CORE_DIR/Cargo.toml"
          touch "$CORE_DIR/src/lib.rs"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 客户端 CURRENT_VERSION 来自 Cargo.toml；tag 与三处版本不一致时，
      # 新包装上后仍报告旧版本，会反复提示更新（换身循环）。
      # workflow_dispatch 的版本号已经按渠道规范化，这里直接把三处工程版本对齐；
      # tag 推送仍保持严格校验，避免打错 tag 被静默掩盖。
      - name: 对齐工程版本号
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tag_version="${TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          pkg_version="$(node -p "require('./package.json').version")"
          conf_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "[version] tag=${tag_version} cargo=${cargo_version} package=${pkg_version} tauri=${conf_version}"
          if [ "$tag_version" = "$cargo_version" ] && [ "$cargo_version" = "$pkg_version" ] && [ "$pkg_version" = "$conf_version" ]; then
            echo "[version] 三处版本与 tag 一致"
            exit 0
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::版本不一致：发布 tag 必须与 src-tauri/Cargo.toml、package.json、src-tauri/tauri.conf.json 三处版本完全相同（含 -beta.N 后缀）。"
            exit 1
          fi
          echo "[version] 手动发布：自动对齐三处工程版本 → ${tag_version}"
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"${tag_version}\"/" src-tauri/Cargo.toml
          node -e "const fs=require('fs');for(const p of ['package.json','src-tauri/tauri.conf.json']){const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${tag_version}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}"
          cargo_new="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          pkg_new="$(node -p "require('./package.json').version")"
          conf_new="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "[version] 对齐后 cargo=${cargo_new} package=${pkg_new} tauri=${conf_new}"

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: 拉取内核动态库（manifest + sha256 校验）
        run: node scripts/fetch-core.mjs

      # --no-bundle：只产出裸 exe，不打 NSIS/MSI 安装器（便携分发）
      - name: 编译启动器（内核 dll 编译期嵌入 exe）
        run: npm run build:portable

      - name: 打包便携 ZIP / 裸 exe
        shell: pwsh
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $stage = "portable/Aelux-Launcher"
          New-Item -ItemType Directory -Force $stage | Out-Null
          # 单文件分发：内核 dll 已嵌入 exe，不再单独拷入
          Copy-Item "src-tauri/target/release/aelux-launcher-app.exe" "$stage/Aelux-Launcher.exe"
          Compress-Archive -Path "portable/Aelux-Launcher" -DestinationPath $env:ZIP_NAME -Force
          # 同时提供裸 exe：新客户端更新时直接下载它，旧客户端继续用 ZIP
          Copy-Item "src-tauri/target/release/aelux-launcher-app.exe" "Aelux-Launcher-$env:TAG.exe"

      # 更新清单：客户端 update_check / 镜像仓库同步都以它为准
      - name: 生成更新清单（launcher-update.json）
        shell: pwsh
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip }}
          EXE_NAME: Aelux-Launcher-${{ steps.meta.outputs.tag }}.exe
          TAG: ${{ steps.meta.outputs.tag }}
          MANIFEST_CHANNEL: ${{ steps.meta.outputs.manifest_channel }}
        run: node scripts/make-update-manifest.mjs --zip $env:ZIP_NAME --exe $env:EXE_NAME --tag $env:TAG --channel $env:MANIFEST_CHANNEL

      # 无论后面 Release 步骤成败，构建产物都挂在本次运行的 Artifacts 区可下载（测试取包用）
      - name: 上传构建产物（Actions 运行页可下载）
        uses: actions/upload-artifact@v4
        with:
          name: Aelux-Launcher-portable-windows
          path: |
            ${{ steps.meta.outputs.zip }}
            Aelux-Launcher-${{ steps.meta.outputs.tag }}.exe
            launcher-update.json
          if-no-files-found: warn

      - name: 创建 GitHub Release 并上传便携包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.channel == 'beta' }}
          files: |
            ${{ steps.meta.outputs.zip }}
            Aelux-Launcher-${{ steps.meta.outputs.tag }}.exe
            launcher-update.json

      # 镜像仓库（Aelux-Updates）监听 repository_dispatch 立即同步；
      # 未配置 secrets 时跳过（镜像仓库的定时任务兜底）。
      - name: 通知镜像仓库同步（可选）
        if: env.MIRROR_TOKEN != '' && env.MIRROR_REPO != ''
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $MIRROR_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${MIRROR_REPO}/dispatches" \
            -d "{\"event_type\":\"launcher-release\",\"client_payload\":{\"tag\":\"${TAG}\",\"source_repo\":\"${GITHUB_REPO}\"}}" \
            || echo "镜像仓库通知失败（可在镜像仓库手动触发 sync）"
