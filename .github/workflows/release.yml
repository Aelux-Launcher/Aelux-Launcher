name: 发布 Windows 便携包

# 发布 Windows 便携包（免安装，解压即用）。
#
# 渠道（channel）：
#   beta   → 产物命名 Aelux-Launcher-v0.1.0-Beta.zip（测试版）
#   stable → 产物命名 Aelux-Launcher-v0.1.0-Stable.zip（正式版）
# tag 触发时按 tag 名自动判断：tag 含 "beta"（如 v0.2.0-beta.1）→ Beta，否则 Stable。
#
# 测试期版本号策略：三处版本号统一维护为 0.1.0，不随构建自增——
#   package.json / src-tauri/tauri.conf.json（启动器）、Aelux-Core/Cargo.toml（内核）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.1.0；仅用于 Release 命名）"
        required: false
        default: "0.1.0"
      channel:
        description: "发布渠道"
        type: choice
        options: ["beta", "stable"]
        default: "beta"

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest
    env:
      CORE_MANIFEST_URL: ${{ secrets.CORE_MANIFEST_URL }}
      CORE_DOWNLOAD_TOKEN: ${{ secrets.CORE_DOWNLOAD_TOKEN }}
      # 注入更新默认仓库（build.rs → AELUX_UPDATE_REPO，客户端 GitHub 更新源）
      GITHUB_REPO: ${{ github.repository }}
      MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
      MIRROR_REPO: ${{ secrets.MIRROR_REPO }}
    steps:
      - uses: actions/checkout@v4

      # aelux-core 是 optional path 依赖，Cargo resolve 要求路径存在；
      # release-ffi 只消费 cdylib 二进制（fetch-core 下载），不需要内核源码。
      - name: Stub aelux-core (resolve only)
        shell: bash
        run: |
          CORE_DIR="$(pwd)/../Aelux-Core"
          mkdir -p "$CORE_DIR/src"
          printf '[package]\nname = "aelux-core"\nversion = "0.0.0"\nedition = "2021"\n' > "$CORE_DIR/Cargo.toml"
          touch "$CORE_DIR/src/lib.rs"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: 拉取内核动态库（manifest + sha256 校验）
        run: node scripts/fetch-core.mjs

      # --no-bundle：只产出裸 exe，不打 NSIS/MSI 安装器（便携分发）
      - name: 编译启动器（内核 dll 随包分发）
        run: npm run build:portable

      - name: 打包便携 ZIP
        shell: pwsh
        run: |
          $stage = "portable/Aelux-Launcher"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "src-tauri/target/release/aelux-launcher-app.exe" "$stage/Aelux-Launcher.exe"
          Copy-Item "src-tauri/lib/windows-x64/aelux_core.dll" $stage
          # 使用说明：解压后双击 exe 即用；数据写在 exe 同级 data/ 目录
          "# Aelux Launcher`n`n解压到任意目录，双击 Aelux-Launcher.exe 即可运行（免安装）。`n数据保存在本目录 data/ 下，整目录拷走即可迁移。`n" | Set-Content "$stage/README.txt"
          $tag = "${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}"
          # 渠道后缀：dispatch 按 input；tag 触发按 tag 名含 beta 判断
          $channel = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel || '' }}"
          if ($channel -eq "beta" -or $tag -match "beta") { $suffix = "Beta" } else { $suffix = "Stable" }
          Compress-Archive -Path "portable/Aelux-Launcher" -DestinationPath "Aelux-Launcher-$tag-$suffix.zip" -Force

      # 更新清单：客户端 update_check / 镜像仓库同步都以它为准
      - name: 生成更新清单（launcher-update.json）
        shell: pwsh
        run: |
          # tag / suffix 与上一步同一套规则
          $tag = "${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}"
          $channel = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel || '' }}"
          if ($channel -eq "beta" -or $tag -match "beta") { $suffix = "Beta" } else { $suffix = "Stable" }
          node scripts/make-update-manifest.mjs --zip "Aelux-Launcher-$tag-$suffix.zip" --tag "$tag"

      # 无论后面 Release 步骤成败，构建产物都挂在本次运行的 Artifacts 区可下载（测试取包用）
      - name: 上传构建产物（Actions 运行页可下载）
        uses: actions/upload-artifact@v4
        with:
          name: Aelux-Launcher-portable-windows
          path: |
            Aelux-Launcher-*.zip
            launcher-update.json
          if-no-files-found: warn

      - name: 创建 GitHub Release 并上传便携 ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: |
            Aelux-Launcher-*.zip
            launcher-update.json

      # 镜像仓库（Aelux-Updates）监听 repository_dispatch 立即同步；
      # 未配置 secrets 时跳过（镜像仓库的定时任务兜底）。
      - name: 通知镜像仓库同步（可选）
        if: env.MIRROR_TOKEN != '' && env.MIRROR_REPO != ''
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}"
          curl -sf -X POST \
            -H "Authorization: Bearer $MIRROR_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${MIRROR_REPO}/dispatches" \
            -d "{\"event_type\":\"launcher-release\",\"client_payload\":{\"tag\":\"$TAG\",\"source_repo\":\"${GITHUB_REPO}\"}}" \
            || echo "镜像仓库通知失败（可在镜像仓库手动触发 sync）"
