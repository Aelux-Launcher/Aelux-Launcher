name: Release

# 发布 Windows 便携包（免安装，解压即用）。
#
# 触发方式（二选一，均为手动）：
#   1. 打 tag：git tag v0.1.0 && git push origin v0.1.0（Release 会以 tag 命名）
#   2. Actions 页面手动运行 workflow_dispatch（测试构建，Release 以运行时的 tag 参数命名）
#
# 测试期版本号策略：三处版本号统一维护为 0.1.0，不随构建自增——
#   package.json / src-tauri/tauri.conf.json（启动器）、Aelux-Core/Cargo.toml（内核）。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.1.0；仅用于 Release 命名）"
        required: false
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CORE_MANIFEST_URL: ${{ secrets.CORE_MANIFEST_URL }}
    steps:
      - uses: actions/checkout@v4

      # aelux-core 是 optional path 依赖，Cargo resolve 要求路径存在；
      # release-ffi 只消费 cdylib 二进制（fetch-core 下载），不需要内核源码。
      - name: Stub aelux-core (resolve only)
        shell: bash
        run: |
          CORE_DIR="$(pwd)/../Aelux-Core"
          mkdir -p "$CORE_DIR/src"
          printf '[package]\nname = "aelux-core"\nversion = "0.0.0"\nedition = "2021"\n' > "$CORE_DIR/Cargo.toml"
          touch "$CORE_DIR/src/lib.rs"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Fetch core cdylib
        run: node scripts/fetch-core.mjs

      # --no-bundle：只产出裸 exe，不打 NSIS/MSI 安装器（便携分发）
      - name: Build portable (release-ffi)
        run: npm run build:portable

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $stage = "portable/Aelux-Launcher"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "src-tauri/target/release/aelux-launcher-app.exe" $stage
          Copy-Item "src-tauri/lib/windows-x64/aelux_core.dll" $stage
          # 使用说明：解压后双击 exe 即用；数据写在 exe 同级 data/ 目录
          "# Aelux Launcher`n`n解压到任意目录，双击 aelux-launcher-app.exe 即可运行（免安装）。`n数据保存在本目录 data/ 下，整目录拷走即可迁移。`n" | Set-Content "$stage/README.txt"
          $tag = "${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}"
          Compress-Archive -Path "portable/Aelux-Launcher" -DestinationPath "Aelux-Launcher-portable-windows-x64-$tag.zip" -Force
          Write-Host "artifact=Aelux-Launcher-portable-windows-x64-$tag.zip" >> $env:GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: Aelux-Launcher-portable-windows-x64-*.zip
