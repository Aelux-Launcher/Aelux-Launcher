name: Release

# 打 tag（v*）触发：拉取私有内核 cdylib → 打包安装包 → 便携 ZIP → 公开 Release。
# 内核二进制来源：CORE_MANIFEST_URL（secrets，指向 R2 桶或私有 core 仓库的 manifest.json）。
# 当前先支持 Windows；扩展平台时在 matrix 中追加即可（mac/linux 打包步骤已在历史中验证过模板）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      CORE_MANIFEST_URL: ${{ secrets.CORE_MANIFEST_URL }}
    steps:
      - uses: actions/checkout@v4

      # aelux-core 是 optional path 依赖，Cargo resolve 要求路径存在；
      # release-ffi 只消费 cdylib 二进制（fetch-core 下载），不需要内核源码。
      - name: Stub aelux-core (resolve only)
        shell: bash
        run: |
          CORE_DIR="$(pwd)/../Aelux-Core"
          mkdir -p "$CORE_DIR/src"
          printf '[package]\nname = "aelux-core"\nversion = "0.0.0"\nedition = "2021"\n' > "$CORE_DIR/Cargo.toml"
          touch "$CORE_DIR/src/lib.rs"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Fetch core cdylib
        run: node scripts/fetch-core.mjs

      - name: Build (release-ffi)
        run: npm run build:release

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $stage = "portable/Aelux-Launcher"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "src-tauri/target/release/aelux-launcher-app.exe" $stage
          Copy-Item "src-tauri/lib/windows-x64/aelux_core.dll" $stage
          Compress-Archive -Path "portable/Aelux-Launcher" -DestinationPath "Aelux-Launcher-portable-windows-x64.zip" -Force

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} release-assets/ \; || true
          ls release-assets

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            Aelux-Launcher-portable-windows-x64.zip
